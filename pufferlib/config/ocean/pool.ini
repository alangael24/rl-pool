[base]
package = ocean
env_name = puffer_pool
policy_name = Policy
rnn_name = None

[env]
num_envs = 2048
width = 2.84
height = 1.42
ball_radius = 0.03
pocket_radius = 0.06
friction = 0.992
restitution = 0.96
impulse = 0.12
min_power = 0.35
reward_step = 0.0
reward_shot = -0.001
reward_progress = 1.4
reward_pot_object = 1.0
reward_scratch = -0.5
fast_forward = True
max_physics_steps = 128
max_steps = 120
report_interval = 64

[vec]
num_envs = 16

[train]
total_timesteps = 50_000_000
gamma = 0.99
learning_rate = 0.01
minibatch_size = 32768
update_epochs = 2
ent_coef = 0.00001

# Presets:
# quality (default): tuned for stable positive return
# fast (CLI overrides): --train.update-epochs 1 --train.minibatch-size 65536 --train.max-minibatch-size 65536 --env.max-physics-steps 96

[sweep]
method = Protein
metric = score
