[base]
package = ocean
env_name = puffer_pool
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 2048
width = 2.84
height = 1.42
ball_radius = 0.03
pocket_radius = 0.06
friction = 0.992
restitution = 0.96
impulse = 0.12
reward_step = -0.001
reward_pot_object = 1.0
reward_scratch = -0.5
max_steps = 300
report_interval = 64

[vec]
num_envs = 16

[train]
total_timesteps = 50_000_000
gamma = 0.99
learning_rate = 0.01
minibatch_size = 16384

[sweep]
method = Protein
metric = score
